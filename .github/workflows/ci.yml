name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  core:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
    steps:
      - uses: actions/checkout@v4
      - name: Install GoogleTest
        run: sudo apt-get update && sudo apt-get install -y libgtest-dev ninja-build
      - name: Configure
        run: cmake -S core -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=${{ matrix.compiler }} -DGFG_WERROR=ON
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  # Geometry bugs are index arithmetic; the sanitizers turn an off-by-one into
  # a failed build instead of a wrong answer.
  sanitizers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install GoogleTest
        run: sudo apt-get update && sudo apt-get install -y libgtest-dev ninja-build
      - name: Build with ASan + UBSan
        run: |
          cmake -S core -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DGFG_WERROR=ON -DGFG_SANITIZE=ON
          cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  # The node is built and tested in a real ROS 2 install, then launched as a
  # separate process and driven from the ros2 CLI. Unit tests of the node
  # prove the callbacks; only the launched process proves the package.
  ros2:
    runs-on: ubuntu-24.04
    container: ros:jazzy-ros-base
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          path: src/geofence-guard
      - name: Build
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --cmake-args -DGFG_BUILD_TESTS=OFF -DGFG_WERROR=ON
      - name: Test
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon test --packages-select geofence_guard_ros --event-handlers console_direct+
          colcon test-result --verbose
      - name: Launch and drive the node
        run: |
          source install/setup.bash
          src/geofence-guard/scripts/smoke.sh

  # Fly the mission in PX4 SITL twice: straight to the autopilot (the control,
  # which must breach the fence) and through the guard (which must not). The
  # assertion is on the logged odometry, not on what the guard says it did.
  sitl:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Build the ROS + MAVROS image
        run: docker build -f sitl/Dockerfile -t geofence-guard-sitl:dev .
      - name: Pull PX4 SITL
        run: docker pull jonasvautherin/px4-gazebo-headless:1.15.4
      - name: Fly both runs
        run: sitl/run.sh sitl-out both
      - name: Assert the guarded run stayed inside the fence
        run: |
          docker run --rm -u "$(id -u):$(id -g)" -e HOME=/tmp -e MPLCONFIGDIR=/tmp \
            -v "$PWD":/repo -v "$PWD/sitl-out":/out geofence-guard-sitl:dev \
            python3 /repo/sitl/analyze.py /out --check --gif /out/sitl.gif
      - name: Keep the logs and the animation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sitl-run
          path: sitl-out/
